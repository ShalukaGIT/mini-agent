name: mini-agent

on:
  schedule:
    # GitHub cron is UTC. Sri Lanka = UTC+5:30
    - cron: "30 1 * * *"   # 07:00 Asia/Colombo - morning brief
    - cron: "30 13 * * *"  # 19:00 Asia/Colombo - evening review
  workflow_dispatch:
    inputs:
      task:
        description: "Which task to run"
        required: false
        default: "morning"
        type: choice
        options: [morning, evening, test]
      message:
        description: "Ad-hoc prompt (overrides task)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mini-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick task from schedule
        id: pick
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then TASK=morning; else TASK=evening; fi
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "selected task: $TASK"

      - name: Run agent
        env:
          ROAR_AI_API_KEY: ${{ secrets.ROAR_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINI_TASK: ${{ steps.pick.outputs.task }}
          MINI_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          if [ -n "$MINI_MESSAGE" ]; then
            python agent.py --message "$MINI_MESSAGE"
          else
            python agent.py --task "$MINI_TASK"
          fi
